{% extends "base.html" %}

{% block title %}walldiff — {{ config.title }}{% endblock title %}

{% block content %}
<main>

<div class="wrap">
  <nav class="back-link">
    <a href="/">&larr; Home</a>
  </nav>

  <div class="terminal terminal-walldiff">
    <div class="terminal-bar">
      <span>tty5</span>
      <div class="terminal-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-cyan"></span>
      </div>
    </div>
    <div class="terminal-body" style="align-items:stretch;">
      <div class="prompt"><span>$</span> walldiff</div>

      <div id="drop-zone" class="walldiff-drop">
        <label for="image-loader">drop an image <span class="walldiff-drop-or">or</span> <u>browse</u></label>
        <input type="file" id="image-loader" name="image-loader" accept=".jpg,.jpeg,.png,.webp" />
      </div>

      <canvas id="image-canvas" class="walldiff-canvas"></canvas>

      <div class="walldiff-buttons">
        <button class="compress-btn" id="download-button" type="button" onclick="downloadImage()">download</button>
        <button class="compress-btn" id="reset-button" type="button" onclick="reset()">reset image</button>
      </div>

      <div class="walldiff-options">
        <button class="walldiff-btn" id="opt-up" onclick="scrollTheme(-1)">▲</button>
        <select name="Colour Scheme" id="theme-select" class="walldiff-select" aria-label="theme">
        </select>
        <button class="walldiff-btn" id="opt-down" onclick="scrollTheme(1)">▼</button>
      </div>

      <label class="walldiff-invert" for="invert-toggle" title="invert colours before applying the colour scheme">
        <input type="checkbox" id="invert-toggle"> invert
      </label>

      <button class="compress-btn walldiff-convert" id="convert" type="button" onclick="initialize()">convert</button>

      <div class="walldiff-credit">
        engine —
        <a href="https://github.com/Achno/gowall" target="_blank" rel="noopener noreferrer">gowall</a>
      </div>
    </div>
  </div>
</div>

</main>
{% endblock content %}

{% block extrascripts %}
{{ super() }}
<script defer src="/walldiff/assets/walldiff.js"></script>
{% endblock extrascripts %}
