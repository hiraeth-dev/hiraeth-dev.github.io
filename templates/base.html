<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t;try{var p=new URLSearchParams(window.location.search).get('theme');t=p||localStorage.getItem('theme')}catch(e){}var v=['solitude','gruvbox','kanagawa','dusky','cyberpunk'];if(v.indexOf(t)<0)t='kanagawa';document.documentElement.setAttribute('data-theme',t);var f;try{var pf=new URLSearchParams(window.location.search).get('font');f=pf||localStorage.getItem('font')}catch(e){}var fv=['maple','iosevka'];if(fv.indexOf(f)<0)f='maple';document.documentElement.setAttribute('data-font',f);document.documentElement.classList.add('js')})();</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preload" href="/fonts/MapleMono-NF-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/MapleMono-NF-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/MapleMono-NF-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/MapleMono-NF-BoldItalic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Iosevka-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Iosevka-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
</head>
<body>
<div id="scroll-bar" aria-hidden="true"></div>
{% block canvas %}<canvas id="grid-canvas"></canvas>{% endblock canvas %}

<nav class="top">
  <a href="/" class="logo">{% include "cat-logo.html" %}<span class="logo-text"><span class="logo-sym">~</span>hiraeth</span></a>
  <ul class="nav-links" id="nav-links">
    <li><a href="https://hiraeth-dev.github.io/dictionary/" class="ext">dict</a></li>
    <li><a href="/walldiff/">walldiff</a></li>
    <li><a href="/abeyant/">abeyant</a></li>
    <li><a href="/typing/">typer</a></li>
    <li><a href="https://github.com/hiraeth-dev" class="ext">github</a></li>
  </ul>
  <div class="theme-pick">
    <button class="theme-btn" id="font-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Font" title="Font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <div class="theme-menu" id="font-menu">
      <button type="button" data-font-opt="maple">Maple Mono</button>
      <button type="button" data-font-opt="iosevka">Iosevka</button>
    </div>
  </div>
  <div class="theme-pick">
    <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Theme" title="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <div class="theme-menu" id="theme-menu">
      <button type="button" data-theme-opt="kanagawa">kanagawa</button>
      <button type="button" data-theme-opt="solitude">solitude</button>
      <button type="button" data-theme-opt="gruvbox">gruvbox</button>
      <button type="button" data-theme-opt="dusky">dusky</button>
      <button type="button" data-theme-opt="cyberpunk">cyberpunk</button>
    </div>
  </div>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <a href="https://github.com/hiraeth-dev/hiraeth-dev.github.io" class="rule">(&gt;.&lt;) zzZ</a>
</footer>

<script src="/js/copy.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/font.js"></script>
<script src="/js/anim.js"></script>
{% block extrascripts %}<script src="/js/grid.js"></script>{% endblock extrascripts %}
</body>
</html>
